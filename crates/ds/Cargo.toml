[package]
name = "ds"
version = "2.0.0"
description = "A library for controlling FIRST Robotics Competition robots"
authors = ["Kaitlyn Kenwell <redrield@gmail.com>"]
license = "MIT OR Apache-2.0"
keywords = ["frc", "first", "robotics"]
categories = ["network-programming"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
bitflags = "2.11"
bytes = "1.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
thiserror = "2.0"
tokio = { workspace = true, features = ["net", "rt", "time", "sync", "macros", "io-util"] }
tracing.workspace = true

[features]
# A fake roboRIO for tests
testing = []

[dev-dependencies]
ds = { path = ".", features = ["testing"] }

[lints]
workspace = true
