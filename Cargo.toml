[workspace]
members = [".", "crates/ds"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/Redrield/Conductor"

[workspace.dependencies]
tokio = "1.53"
tracing = "0.1.41"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[package]
name = "conductor"
version = "0.2.0"
authors = ["Kaitlyn Kenwell <redrield@gmail.com>"]
description = "A cross-platform driver station for FRC robots, with MCP support for AI agents"
license = "MPL-2.0"
homepage = "https://github.com/Redrield/Conductor"
readme = "README.md"
keywords = ["frc", "first", "robotics", "driver-station", "mcp"]
categories = ["science::robotics", "command-line-utilities"]
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
build = "build.rs"
exclude = ["/images", "/ui/node_modules", "/ui/dist"]

[features]
default = ["gui"]
# Native windows (WebKitGTK on Linux, WKWebView on macOS) and global hotkeys.
# Without it Conductor runs headless and serves its UI to a browser.
gui = ["dep:wry", "dep:tao", "dep:x11", "dep:core-foundation"]

[dependencies]
ds = { path = "crates/ds" }

anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6", features = ["derive", "env"] }
confy = "2.0"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
gilrs = "0.11.2"
human-panic = "2.0.8"
mime_guess = "2.0.5"
rmcp = { version = "3.5.1", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
rust-embed = "8.13"
schemars = { version = "1.2", features = ["uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tinyfiledialogs = "3.9.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-std"] }
tokio-util = "0.7.16"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28", features = ["v4", "serde"] }

wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10.1", optional = true }

[dev-dependencies]
ds = { path = "crates/ds", features = ["testing"] }
rmcp = { version = "3.5.1", features = ["client"] }

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `cargo deb` — https://github.com/kornelski/cargo-deb
[package.metadata.deb]
name = "conductor"
maintainer = "Conductor contributors"
section = "electronics"
priority = "optional"
depends = "$auto, libwebkit2gtk-4.1-0, libgtk-3-0"
extended-description = """\
Conductor is a driver station for FRC robots on Linux and macOS. It controls \
robots and the WPILib simulator, and includes a Model Context Protocol server \
so AI agents can operate the driver station too."""
assets = [
    ["target/release/conductor", "usr/bin/", "755"],
    ["packaging/linux/io.github.redrield.Conductor.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/io.github.redrield.Conductor.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/linux/conductor.svg", "usr/share/icons/hicolor/scalable/apps/io.github.redrield.Conductor.svg", "644"],
    ["README.md", "usr/share/doc/conductor/README.md", "644"],
]

# `cargo generate-rpm` — https://github.com/cat-in-136/cargo-generate-rpm
[package.metadata.generate-rpm]
name = "conductor"
license = "MPL-2.0"
summary = "Driver station for FRC robots with MCP support"
assets = [
    { source = "target/release/conductor", dest = "/usr/bin/conductor", mode = "755" },
    { source = "packaging/linux/io.github.redrield.Conductor.desktop", dest = "/usr/share/applications/io.github.redrield.Conductor.desktop", mode = "644" },
    { source = "packaging/linux/io.github.redrield.Conductor.metainfo.xml", dest = "/usr/share/metainfo/io.github.redrield.Conductor.metainfo.xml", mode = "644" },
    { source = "packaging/linux/conductor.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.redrield.Conductor.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/conductor/README.md", mode = "644", doc = true },
]
auto-req = "auto"

# `cargo bundle` for the macOS .app
[package.metadata.bundle]
name = "Conductor"
identifier = "io.github.redrield.Conductor"
icon = ["packaging/macos/icon_32.png", "packaging/macos/icon_128.png", "packaging/macos/icon_256.png", "packaging/macos/icon_512.png"]
copyright = "MPL-2.0"
category = "public.app-category.developer-tools"
